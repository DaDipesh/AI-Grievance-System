<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nivaran — Officer</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/api.js"></script><style>
:root{color-scheme:dark}body{background:radial-gradient(ellipse at 15% 0%,#0ea5e918,transparent 35%),linear-gradient(145deg,#071827,#081322 65%,#0b1b2e)!important;color:#eaf4ff!important;font-family:Inter,system-ui,sans-serif}.container{max-width:1450px}.container> .d-flex:first-child{padding:20px 22px;border:1px solid #25445d;border-radius:20px;background:linear-gradient(120deg,#102b43,#0c2035);box-shadow:0 18px 50px #0003}.container h2{font-weight:850;letter-spacing:-.03em}.container .text-secondary{color:#9fb7cb!important}.bg-dark{background:linear-gradient(145deg,#102b43,#0c2035)!important;border:1px solid #25445d;box-shadow:0 12px 34px #0002}.bg-dark h5{font-weight:800;color:#eaf4ff}.bg-dark small{color:#9fb7cb}.bg-dark h3{font-weight:850;color:#f3f9ff}.row.g-3.mb-4 .bg-dark{min-height:110px;position:relative;overflow:hidden}.row.g-3.mb-4 .bg-dark:after{content:"";position:absolute;width:76px;height:76px;border-radius:50%;right:-20px;top:-25px;background:#38bdf81a}.table-responsive.bg-dark,.bg-dark.rounded-4{border-radius:18px!important}.table-dark{--bs-table-bg:transparent;--bs-table-striped-bg:#15334b;--bs-table-hover-bg:#173b57;--bs-table-border-color:#274760;--bs-table-color:#e3eff8}.table>thead th{font-size:.78rem;text-transform:uppercase;letter-spacing:.045em;color:#9fc3dd;white-space:nowrap}.table td{vertical-align:middle}.form-select{background-color:#0b1d31;color:#f4f9ff;border-color:#35536e}.btn{border-radius:10px;font-weight:700}.btn-primary{border:0;background:linear-gradient(110deg,#0ea5e9,#2563eb)}.btn-info{color:#061727;background:#67dcf2;border-color:#67dcf2}.alert{border-radius:12px}.container pre{white-space:pre-wrap;margin:0;color:#69d8ef!important;font:600 .95rem/1.8 ui-monospace,monospace}.container> .row.g-4{margin-top:.1rem}@media(max-width:768px){.container> .d-flex:first-child{align-items:flex-start!important;gap:14px}.container> .d-flex:first-child>div:last-child{display:flex;flex-wrap:wrap;gap:8px}.container{padding-left:14px;padding-right:14px}}
</style></head><body style="background:#071827;color:#eaf4ff;min-height:100vh"><div class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2>Officer Dashboard</h2><p id="officerMeta" class="text-secondary mb-0"></p></div><a href="staff-profile.html" class="btn btn-info me-2"><i class="bi bi-person-circle me-1"></i>My Profile</a><button id="logout" class="btn btn-outline-light">Logout</button></div><div class="row g-3 mb-4"><div class="col-md-3"><div class="p-3 rounded-4 bg-dark"><small>Total</small><h3 id="total">0</h3></div></div><div class="col-md-3"><div class="p-3 rounded-4 bg-dark"><small>Pending</small><h3 id="pending">0</h3></div></div><div class="col-md-3"><div class="p-3 rounded-4 bg-dark"><small>In Progress</small><h3 id="progress">0</h3></div></div><div class="col-md-3"><div class="p-3 rounded-4 bg-dark"><small>Resolved</small><h3 id="resolved">0</h3></div></div></div><div id="message" class="alert d-none"></div><div class="table-responsive bg-dark rounded-4 p-2"><table class="table table-dark table-hover align-middle"><thead><tr><th>ID/Ticket</th><th>Citizen</th><th>Problem</th><th>Photo</th><th>Location</th><th>AI / Department</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>
(async()=>{if(!localStorage.getItem('sg_access_token'))return location.href='login.html';const u=await SG_API.me();if(u.role!=='officer'&&u.role!=='admin')return location.href='index.html';document.querySelector('#officerMeta').textContent=`${u.name||'Officer'} • ${u.department||'All departments'} • ${u.mobile||''}`;document.querySelector('#logout').onclick=()=>{SG_API.clearSession();location.href='login.html'};const msg=(x,ok=false)=>{const e=document.querySelector('#message');e.textContent=x;e.className='alert '+(ok?'alert-success':'alert-danger')};async function load(){try{const list=await SG_API.officerComplaints();['total','pending','progress','resolved'].forEach(id=>document.querySelector('#'+id).textContent= id==='total'?list.length:id==='pending'?list.filter(x=>x.status==='pending').length:id==='progress'?list.filter(x=>x.status==='in_progress').length:list.filter(x=>['resolved','closed'].includes(x.status)).length);document.querySelector('#rows').innerHTML=list.map(c=>`<tr><td><b>#${c.id}</b><br><small>${c.ticket_number}</small></td><td><b>${c.citizen_name||("Citizen #"+c.citizen_id)}</b><br><small>${c.citizen_mobile||""}</small></td><td style="min-width:240px">${c.complaint_text}<br><small>${c.category_predicted||'-'} • ${c.priority||'-'} • ${c.severity||'-'}</small></td><td>${c.evidence_path?`<button type="button" class="btn btn-sm btn-outline-info view-evidence" data-evidence="${c.evidence_path}">View photo</button>`:'—'}</td><td>${c.city||'-'}${c.area?', '+c.area:''}</td><td>${c.department||'-'}<br>${c.assigned_officer_id?'Assigned':'Department queue'}</td><td><span class="badge bg-secondary">${c.status}</span></td><td><select class="form-select form-select-sm statusSelect" data-id="${c.id}"><option value="pending">pending</option><option value="in_progress">in progress</option><option value="resolved">resolved</option><option value="rejected">rejected</option><option value="closed">closed</option></select><button class="btn btn-primary btn-sm mt-2 updateBtn" data-id="${c.id}">Update</button></td></tr>`).join('');document.querySelectorAll('.view-evidence').forEach(b=>b.onclick=()=>SG_API.viewEvidence(b.dataset.evidence).catch(e=>msg(e.message)));document.querySelectorAll('.statusSelect').forEach(s=>{const c=list.find(x=>String(x.id)===s.dataset.id);s.value=c?.status||'pending'});document.querySelectorAll('.updateBtn').forEach(b=>b.onclick=async()=>{const id=b.dataset.id;const s=document.querySelector(`.statusSelect[data-id="${id}"]`).value;try{await SG_API.updateStatus(id,s);msg('Status updated.',true);await load()}catch(e){msg(e.message)}})}catch(e){msg(e.message)}}load();setInterval(()=>{if(document.visibilityState==='visible')load()},3000)})();
</script><script src="js/officer-reminders.js?v=1"></script></body></html>
