<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Nivaran | Admin Details</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><script src="js/api.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 15% 0%,#0ea5e918,transparent 35%),linear-gradient(145deg,#071827,#081322 65%,#0b1b2e);color:#eaf4ff;font-family:Inter,system-ui,sans-serif}.container{max-width:1450px}.topbar,.panel,.item,.metric{border:1px solid #25445d;background:linear-gradient(145deg,#102b43,#0c2035);box-shadow:0 14px 38px #0002}.topbar{border-radius:20px;padding:20px 22px}.topbar h1{font-weight:850}.muted{color:#9fb7cb}.panel{border-radius:18px;padding:20px}.item{display:block;height:100%;padding:18px;border-radius:16px;color:#eaf4ff;text-decoration:none;transition:.18s}.item:hover,.metric:hover{transform:translateY(-2px);border-color:#38bdf8;color:white}.item h2{font-size:18px;font-weight:800}.metric{display:block;height:100%;padding:18px;border-radius:16px;color:#eaf4ff;text-decoration:none;transition:.18s}.metric small{color:#9fc3dd}.metric strong{display:block;font-size:30px;margin-top:5px}.metric.pending{border-top:3px solid #f59e0b}.metric.progress{border-top:3px solid #38bdf8}.metric.resolved{border-top:3px solid #22c55e}.metric.total{border-top:3px solid #818cf8}.table-wrap{overflow:auto}.table-dark{--bs-table-bg:transparent;--bs-table-striped-bg:#15334b;--bs-table-hover-bg:#173b57;--bs-table-border-color:#274760;--bs-table-color:#e3eff8}.table th{font-size:.77rem;text-transform:uppercase;letter-spacing:.04em;color:#9fc3dd;white-space:nowrap}.table td{vertical-align:middle;min-width:90px}.avatar{width:42px;height:42px;object-fit:cover;border-radius:50%}.btn{border-radius:10px;font-weight:700}.status{display:inline-block;padding:4px 9px;border-radius:999px;background:#153b55;color:#bceaff;font-size:12px;white-space:nowrap}.status-action{border:1px solid #37617d;cursor:pointer;font:inherit}.status-action:hover{border-color:#38bdf8;color:#fff}.complaint-text{min-width:220px;max-width:360px;white-space:normal}.alert{border-radius:12px}@media(max-width:650px){.topbar{align-items:flex-start!important;gap:10px}.container{padding-left:14px;padding-right:14px}}
</style></head><body><main class="container py-4"><header class="topbar d-flex justify-content-between align-items-center mb-4"><div><a id="backButton" class="btn btn-outline-info btn-sm mb-2" href="admin.html"><i class="bi bi-arrow-left me-1"></i>Back</a><h1 id="title" class="h2 mb-1">Admin details</h1><p id="subtitle" class="muted mb-0"></p></div><a href="staff-profile.html" class="btn btn-info">My Profile</a></header><div id="message" class="alert d-none" role="status"></div><section id="content"></section></main><dialog id="statusDialog" style="width:min(760px,calc(100% - 24px));max-height:88vh;overflow:auto;border:1px solid #37617d;border-radius:18px;padding:22px;background:#0c2035;color:#eaf4ff"><div class="d-flex justify-content-between align-items-start gap-3"><div><h2 id="dialogTitle" class="h4 mb-1">Complaint status</h2><p id="dialogMeta" class="muted"></p></div><button id="dialogClose" class="btn btn-outline-light btn-sm">Close</button></div><div id="dialogClosedFrom" class="alert alert-info d-none"></div><label class="form-label" for="adminStatusSelect">Change status</label><select id="adminStatusSelect" class="form-select mb-3"><option value="pending">Pending</option><option value="in_progress">In progress</option><option value="resolved">Resolved</option><option value="rejected">Rejected</option><option value="closed">Closed</option><option value="reopened">Reopen</option></select><label class="form-label" for="adminStatusNote">Note</label><textarea id="adminStatusNote" class="form-control mb-3" rows="2"></textarea><button id="saveAdminStatus" class="btn btn-info mb-4">Save status</button><h3 class="h5">Status history</h3><div id="statusHistory" class="muted">Loading...</div></dialog>
<script>
(async()=>{
 if(!localStorage.getItem('sg_access_token'))return location.href='login.html';
 const $=selector=>document.querySelector(selector),params=new URLSearchParams(location.search),view=params.get('view')||'complaints',status=params.get('status')||'all',key=params.get('key')||'';
 const CATEGORIES=['Water Supply','Electricity','Street Light','Road','Healthcare','Sanitation','Drainage','Environment'];
 const DEPARTMENTS=['Water Supply Department','Electricity Department','Municipal Street Light Department','Road Department','Health Department','Sanitation Department','Drainage Department','Environment Department'];
 const STATUS={pending:'Pending',in_progress:'In progress',resolved:'Resolved',reopened:'Reopened',closed:'Closed',rejected:'Rejected'};
 const esc=value=>String(value??'—').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
 let complaintsCache=null;
 const complaints=async()=>complaintsCache||(complaintsCache=await SG_API.adminComplaints());
 const showError=error=>{$('#message').textContent=error.message;$('#message').className='alert alert-danger'};
 const countStatus=(rows,which)=>rows.filter(row=>which==='resolved'?['resolved','closed'].includes(row.status):which==='in_progress'?['in_progress','reopened'].includes(row.status):row.status===which).length;
 const pretty=value=>STATUS[value]||value||'Unknown';
 let activeComplaint=null;
 $('#dialogClose').onclick=()=>$('#statusDialog').close();
 document.addEventListener('click',async event=>{const trigger=event.target.closest('.status-action');if(!trigger)return;try{
  activeComplaint=(await complaints()).find(row=>String(row.id)===trigger.dataset.complaintId);if(!activeComplaint)throw new Error('Complaint not found.');
  $('#dialogTitle').textContent='Complaint #'+activeComplaint.id+' - '+(activeComplaint.ticket_number||'');
  $('#dialogMeta').textContent=(activeComplaint.citizen_name||'Citizen')+' - '+[activeComplaint.area,activeComplaint.city,activeComplaint.district,activeComplaint.state].filter(Boolean).join(', ');
  $('#adminStatusSelect').value=activeComplaint.status;$('#adminStatusNote').value='';
  const history=await SG_API.history(activeComplaint.id),closures=history.filter(item=>item.new_status==='closed'),lastClosed=closures[closures.length-1],closedFrom=$('#dialogClosedFrom');
  closedFrom.classList.toggle('d-none',!lastClosed);closedFrom.textContent=lastClosed?'Closed from: '+pretty(lastClosed.old_status)+(lastClosed.note?' - '+lastClosed.note:''):'This complaint has no recorded close transition.';
  $('#statusHistory').innerHTML=lastClosed?'<div style="padding:10px 0"><strong>Status before close: '+pretty(lastClosed.old_status)+'</strong><small class="d-block">'+(lastClosed.created_at?new Date(lastClosed.created_at).toLocaleString():'')+'</small></div>':'No close status recorded.';
  $('#statusDialog').showModal();
 }catch(error){showError(error)}});
 $('#saveAdminStatus').onclick=async()=>{if(!activeComplaint)return;const button=$('#saveAdminStatus');button.disabled=true;try{await SG_API.updateStatus(activeComplaint.id,$('#adminStatusSelect').value,$('#adminStatusNote').value);$('#statusDialog').close();complaintsCache=null;location.reload()}catch(error){showError(error)}finally{button.disabled=false}};

 function complaintTable(rows){if(!rows.length)return '<div class="panel muted">No matching complaints found.</div>';return `<div class="panel table-wrap"><table class="table table-dark table-hover align-middle mb-0"><thead><tr><th>ID</th><th>Ticket</th><th>Citizen</th><th>Mobile</th><th>Complaint details</th><th>Photo</th><th>Location</th><th>Category</th><th>Priority</th><th>Department</th><th>Status</th><th>Created</th></tr></thead><tbody>${rows.map(row=>{const location=[row.area,row.city,row.district,row.state].filter(Boolean).join(', '),map=row.latitude!=null&&row.longitude!=null?`<a href="https://www.google.com/maps?q=${row.latitude},${row.longitude}" target="_blank" rel="noopener noreferrer">${esc(location||'Open map')}</a>`:esc(location),photo=row.evidence_path?`<button type="button" class="btn btn-sm btn-outline-info view-evidence" data-evidence="${esc(row.evidence_path)}">View photo</button>`:'—';return `<tr><td>${row.id}</td><td>${esc(row.ticket_number)}</td><td>${esc(row.citizen_name)}</td><td>${esc(row.citizen_mobile)}</td><td class="complaint-text">${esc(row.complaint_text)}</td><td>${photo}</td><td>${map}</td><td>${esc(row.category_verified||row.category_predicted)}</td><td>${esc(row.priority)}</td><td>${esc(row.department||row.assigned_department)}</td><td><button type="button" class="status status-action" data-complaint-id="${row.id}">${esc(STATUS[row.status]||row.status)}</button></td><td>${row.created_at?new Date(row.created_at).toLocaleString():''}</td></tr>`}).join('')}</tbody></table></div>`}
 document.addEventListener('click',event=>{const button=event.target.closest('.view-evidence');if(button)SG_API.viewEvidence(button.dataset.evidence).catch(showError)});
 function metric(label,value,filter,style){const href=`admin-details.html?view=category-complaints&key=${encodeURIComponent(key)}${filter==='all'?'':`&status=${filter}`}`;return `<div class="col-6 col-xl-3"><a class="metric ${style}" href="${href}"><small>${label}</small><strong>${value}</strong></a></div>`}
 try{
  const user=await SG_API.me();if(user.role!=='admin')return location.href='index.html';
  let fallback='admin.html';if(view==='department')fallback='admin-details.html?view=departments';else if(view==='category')fallback='admin-details.html?view=categories';else if(view==='category-complaints')fallback=`admin-details.html?view=category&key=${encodeURIComponent(key)}`;else if(view==='departments')fallback='admin.html';else if(view==='categories')fallback='admin.html';
  $('#backButton').href=fallback;$('#backButton').onclick=event=>{try{if(document.referrer&&new URL(document.referrer).origin===location.origin){event.preventDefault();history.back()}}catch{}};
  if(view==='feedback'){
   const rows=await SG_API.adminFeedback();$('#title').textContent='Citizen feedback';$('#subtitle').textContent=`${rows.length} feedback response(s)`;
   $('#content').innerHTML=rows.length?`<div class="panel table-wrap"><table class="table table-dark table-hover align-middle mb-0"><thead><tr><th>Ticket</th><th>Citizen</th><th>Rating</th><th>Feedback</th><th>Submitted</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${esc(row.ticket_number)}</td><td>${esc(row.citizen_name)}</td><td>${'★'.repeat(row.rating)}${'☆'.repeat(5-row.rating)} (${row.rating}/5)</td><td>${esc(row.comment||'—')}</td><td>${row.created_at?new Date(row.created_at).toLocaleString():'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="panel muted">No citizen feedback has been submitted yet.</div>';
  }else if(view==='complaints'){
   let rows=await complaints(),title='All complaints';if(status==='pending'){rows=rows.filter(row=>row.status==='pending');title='Pending complaints'}else if(status==='resolved'){rows=rows.filter(row=>['resolved','closed'].includes(row.status));title='Resolved complaints'}else if(status==='in_progress'){rows=rows.filter(row=>['in_progress','reopened'].includes(row.status));title='In progress complaints'}else if(status==='rejected'){rows=rows.filter(row=>row.status==='rejected');title='Rejected complaints'}
   $('#title').textContent=title;$('#subtitle').textContent=`${rows.length} complaint(s)`;$('#content').innerHTML=complaintTable(rows);
  }else if(view==='categories'){
   const rows=await complaints();$('#title').textContent='Complaint categories';$('#subtitle').textContent='Select a category to view its totals, statuses and complaint details.';
   $('#content').innerHTML=`<div class="row g-3">${CATEGORIES.map(category=>{const matches=rows.filter(row=>(row.category_verified||row.category_predicted)===category);return `<div class="col-md-6 col-xl-3"><a class="item" href="admin-details.html?view=category&key=${encodeURIComponent(category)}"><h2>${esc(category)}</h2><strong class="fs-3">${matches.length}</strong><div class="muted small">Total complaints</div><div class="muted small mt-2">Pending ${countStatus(matches,'pending')} · In progress ${countStatus(matches,'in_progress')} · Resolved ${countStatus(matches,'resolved')}</div></a></div>`}).join('')}</div>`;
  }else if(view==='category'){
   const rows=await complaints(),matches=rows.filter(row=>(row.category_verified||row.category_predicted)===key);if(!CATEGORIES.includes(key))throw new Error('Category not found. Return to categories and choose one of the listed categories.');
   $('#title').textContent=`${key} complaints`;$('#subtitle').textContent='Select a status to open matching complaint details.';
   $('#content').innerHTML=`<div class="row g-3 mb-4">${metric('Total complaints',matches.length,'all','total')}${metric('In progress',countStatus(matches,'in_progress'),'in_progress','progress')}${metric('Pending',countStatus(matches,'pending'),'pending','pending')}${metric('Resolved',countStatus(matches,'resolved'),'resolved','resolved')}</div><div class="d-flex flex-wrap gap-2 mb-3">${['all','pending','in_progress','resolved'].map(s=>`<a class="btn btn-outline-info btn-sm" href="admin-details.html?view=category-complaints&key=${encodeURIComponent(key)}${s==='all'?'':`&status=${s}`}">View ${s==='all'?'all':STATUS[s].toLowerCase()} complaints</a>`).join('')}</div>`;
  }else if(view==='category-complaints'){
   const rows=await complaints();let matches=rows.filter(row=>(row.category_verified||row.category_predicted)===key),label='All';if(status==='pending'){matches=matches.filter(row=>row.status==='pending');label='Pending'}else if(status==='in_progress'){matches=matches.filter(row=>['in_progress','reopened'].includes(row.status));label='In progress'}else if(status==='rejected'){matches=matches.filter(row=>row.status==='rejected');label='Rejected'}else if(status==='resolved'){matches=matches.filter(row=>['resolved','closed'].includes(row.status));label='Resolved'}
   $('#title').textContent=`${key} · ${label} complaints`;$('#subtitle').textContent=`${matches.length} complaint(s) · Complaint ID, citizen, location, details and current status`;$('#content').innerHTML=complaintTable(matches);
  }else if(view==='departments'){
   const officers=await SG_API.adminOfficers(),counts=officers.reduce((result,officer)=>{const department=officer.department||'';result[department]=(result[department]||0)+1;return result},{});$('#title').textContent='Departments';$('#subtitle').textContent='Choose a department to view only its officers.';
   $('#content').innerHTML=`<div class="row g-3">${DEPARTMENTS.map(department=>`<div class="col-md-6 col-xl-3"><a class="item" href="admin-details.html?view=department&key=${encodeURIComponent(department)}"><h2>${esc(department)}</h2><div class="fs-3">${counts[department]||0}</div><small class="muted">Officer(s)</small></a></div>`).join('')}</div>`;
  }else if(view==='department'){
   const officers=(await SG_API.adminOfficers()).filter(officer=>officer.department===key);$('#title').textContent=key;$('#subtitle').textContent=`${officers.length} officer(s) in this department`;
   $('#content').innerHTML=officers.length?`<div class="panel table-wrap"><table class="table table-dark table-hover align-middle mb-0"><thead><tr><th>Photo</th><th>Name</th><th>Mobile</th><th>Gender</th><th>Email</th><th>City</th><th>District</th><th>State</th><th>Address</th><th>Map</th><th>Active</th></tr></thead><tbody>${officers.map(officer=>`<tr><td>${officer.profile_photo_data?`<img class="avatar" src="${esc(officer.profile_photo_data)}" alt="Officer photo">`:'—'}</td><td>${esc(officer.name)}</td><td>${esc(officer.mobile)}</td><td>${esc(officer.gender)}</td><td>${esc(officer.email)}</td><td>${esc(officer.city)}</td><td>${esc(officer.district)}</td><td>${esc(officer.state)}</td><td>${esc(officer.address)}</td><td>${officer.latitude!=null&&officer.longitude!=null?`<a href="https://www.google.com/maps?q=${officer.latitude},${officer.longitude}" target="_blank" rel="noopener noreferrer">Open map</a>`:'—'}</td><td>${officer.active?'Yes':'No'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="panel muted">No officers are registered in this department yet.</div>';
  }else location.href='admin-details.html?view=complaints';
 }catch(error){if(error.status===401){SG_API.clearSession();location.href='login.html'}else showError(error)}
})();
</script></body></html>
